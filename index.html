<script>

/* ==========================================
   حافظه اولیه
========================================== */

const defaultMemory = {

    "سلام":
        "سلام! 👋",

    "سلام خوبی":
        "سلام! من خوبم 😄 تو چطوری؟",

    "خوبی":
        "مرسی، خوبم ❤️",

    "اسمت چیه":
        "من My AI هستم 🤖",

    "تو چی هستی":
        "من یک هوش مصنوعی ساده و قابل یادگیری هستم.",

    "ممنون":
        "خواهش می‌کنم ❤️",

    "خداحافظ":
        "خداحافظ 👋",

    "پایتون چیست":
        "پایتون یک زبان برنامه‌نویسی است.",

    "هوش مصنوعی چیست":
        "هوش مصنوعی فناوری‌ای است که به کامپیوترها اجازه می‌دهد بعضی کارهای هوشمندانه را انجام دهند."
};


/* ==========================================
   بارگذاری حافظه
========================================== */

let memory;

try{

    const saved =
        localStorage.getItem("MY_AI_MEMORY");

    if(saved){

        memory = {
            ...defaultMemory,
            ...JSON.parse(saved)
        };

    }else{

        memory = {
            ...defaultMemory
        };

    }

}catch{

    memory = {
        ...defaultMemory
    };

}


/* ==========================================
   ذخیره حافظه
========================================== */

function saveMemory(){

    localStorage.setItem(
        "MY_AI_MEMORY",
        JSON.stringify(memory)
    );

}


/* ==========================================
   تمیز کردن متن
========================================== */

function cleanText(text){

    return text
        .trim()
        .toLowerCase()
        .replaceAll("ي","ی")
        .replaceAll("ك","ک")
        .replace(/[؟?!.,،؛]/g,"");

}


/* ==========================================
   نمایش پیام
========================================== */

function addMessage(text,type){

    const row =
        document.createElement("div");

    row.className =
        "row " + type;


    const message =
        document.createElement("div");

    message.className =
        "message";


    message.textContent =
        text;


    row.appendChild(message);


    document
        .getElementById("chat")
        .appendChild(row);


    scrollChat();

}


/* ==========================================
   اسکرول
========================================== */

function scrollChat(){

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;

}


/* ==========================================
   شباهت سؤال‌ها
========================================== */

function similarity(a,b){

    if(a === b)
        return 1;


    if(a.includes(b) || b.includes(a))
        return 0.8;


    const max =
        Math.max(a.length,b.length);


    if(max === 0)
        return 1;


    let previous =
        Array.from(
            {length:b.length+1},
            (_,i)=>i
        );


    for(let i=1;i<=a.length;i++){

        const current = [i];


        for(let j=1;j<=b.length;j++){

            current[j] =
                Math.min(

                    current[j-1] + 1,

                    previous[j] + 1,

                    previous[j-1] +
                    (a[i-1] === b[j-1] ? 0 : 1)

                );

        }


        previous =
            current;

    }


    return (
        1 -
        previous[b.length] / max
    );

}


/* ==========================================
   آموزش AI
========================================== */

function teach(text){

    const data =
        text
        .substring(
            text.indexOf(":") + 1
        )
        .split("|");


    if(data.length < 2){

        return (
            "❌ فرمت اشتباه است.\n\n" +
            "مثال:\n" +
            "یاد بگیر: رنگ آسمان چیست | آبی است."
        );

    }


    const question =
        cleanText(data[0]);


    const answer =
        data
        .slice(1)
        .join("|")
        .trim();


    if(!question || !answer){

        return "❌ سؤال یا جواب خالی است.";

    }


    memory[question] =
        answer;


    saveMemory();


    return (
        "✅ یاد گرفتم!\n\n" +
        "سؤال: " +
        data[0].trim() +
        "\nجواب: " +
        answer
    );

}


/* ==========================================
   ماشین حساب
========================================== */

function calculator(expression){

    if(
        !/^[0-9+\-*/().% ]+$/
        .test(expression)
    ){

        return null;

    }


    try{

        return Function(
            '"use strict";return (' +
            expression +
            ')'
        )();

    }catch{

        return null;

    }

}


/* ==========================================
   پاسخ AI
========================================== */

function getAnswer(original){

    const text =
        cleanText(original);


    /* آموزش */

    if(
        text.startsWith("یاد بگیر:")
    ){

        return teach(original);

    }


    /* حافظه */

    if(
        text === "/memory" ||
        text === "حافظه"
    ){

        return (
            "🧠 تعداد چیزهایی که یاد گرفته‌ام: " +
            Object.keys(memory).length
        );

    }


    /* پاک کردن */

    if(
        text === "/clear" ||
        text === "پاک کردن حافظه"
    ){

        memory = {};

        saveMemory();

        return "🗑️ حافظه پاک شد.";

    }


    /* راهنما */

    if(
        text === "/help" ||
        text === "راهنما"
    ){

        return (
`🤖 My AI

دستورها:

🧠 حافظه
/memory

🗑️ پاک کردن
/clear

📚 یادگیری:
یاد بگیر: سؤال | جواب

🧮 ماشین حساب:
حساب کن: 20 + 30 * 2

🖼️ عکس:
از دکمه عکس استفاده کن.`
        );

    }


    /* ماشین حساب */

    if(
        text.startsWith("حساب کن")
    ){

        let expression =
            original
            .replace(
                /^حساب کن\s*:?\s*/i,
                ""
            );


        const result =
            calculator(expression);


        if(result === null){

            return "❌ محاسبه نامعتبر است.";

        }


        return "🧮 جواب: " + result;

    }


    /* پاسخ مستقیم */

    if(
        memory[text]
    ){

        return memory[text];

    }


    /* پیدا کردن سؤال مشابه */

    let bestQuestion = null;

    let bestScore = 0;


    for(
        const question of
        Object.keys(memory)
    ){

        const score =
            similarity(
                text,
                question
            );


        if(score > bestScore){

            bestScore =
                score;

            bestQuestion =
                question;

        }

    }


    if(
        bestQuestion &&
        bestScore >= 0.58
    ){

        return memory[
            bestQuestion
        ];

    }


    /* پاسخ ناشناخته */

    return (
        "🤔 این را هنوز بلد نیستم.\n\n" +
        "می‌توانی به من یاد بدهی:\n\n" +
        "یاد بگیر: " +
        original +
        " | جواب"
    );

}


/* ==========================================
   ارسال پیام
========================================== */

function sendMessage(){

    const input =
        document.getElementById("input");


    const text =
        input.value.trim();


    if(!text)
        return;


    addMessage(
        text,
        "user"
    );


    input.value = "";


    setTimeout(()=>{

        const answer =
            getAnswer(text);


        addMessage(
            answer,
            "ai"
        );

    },250);

}


/* ==========================================
   Enter
========================================== */

document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                sendMessage();

            }

        }
    );


/* ==========================================
   عکس
========================================== */

function openImage(){

    document
        .getElementById("imageInput")
        .click();

}


document
    .getElementById("imageInput")
    .addEventListener(
        "change",
        function(event){

            const file =
                event.target.files[0];


            if(!file)
                return;


            const reader =
                new FileReader();


            reader.onload =
                function(e){

                    const row =
                        document.createElement("div");

                    row.className =
                        "row user";


                    const box =
                        document.createElement("div");

                    box.className =
                        "message";


                    box.appendChild(
                        document.createTextNode(
                            "🖼️ عکس:"
                        )
                    );


                    const image =
                        document.createElement("img");


                    image.src =
                        e.target.result;


                    image.alt =
                        file.name;


                    box.appendChild(
                        image
                    );


                    row.appendChild(
                        box
                    );


                    document
                        .getElementById("chat")
                        .appendChild(row);


                    scrollChat();


                    setTimeout(()=>{

                        addMessage(
                            "✅ عکس دریافت شد.\n" +
                            "نام فایل: " +
                            file.name +
                            "\nاندازه: " +
                            Math.round(
                                file.size / 1024
                            ) +
                            " KB",
                            "ai"
                        );

                    },400);

                };


            reader.readAsDataURL(
                file
            );


            event.target.value = "";

        }
    );


/* ==========================================
   نمایش حافظه
========================================== */

function showMemory(){

    const keys =
        Object.keys(memory);


    if(keys.length === 0){

        addMessage(
            "🧠 حافظه خالی است.",
            "ai"
        );

        return;

    }


    let result =
        "🧠 حافظه من:\n\n";


    keys.forEach(
        (key,index)=>{

            result +=
                (index + 1) +
                ". " +
                key +
                "\n";

        }
    );


    addMessage(
        result,
        "ai"
    );

}


/* ==========================================
   راهنمای آموزش
========================================== */

function showHelp(){

    addMessage(
`📚 آموزش AI

مثال:

یاد بگیر: رنگ آسمان چیست | آبی است.

بعد بنویس:

رنگ آسمان چیست

AI جواب را از حافظه‌اش می‌دهد.

برای راهنما:
/help`,
        "ai"
    );

}


/* ==========================================
   پاک کردن حافظه
========================================== */

function clearMemory(){

    if(
        !confirm(
            "همه حافظه AI پاک شود؟"
        )
    )
        return;


    memory = {};

    saveMemory();


    addMessage(
        "🗑️ حافظه پاک شد.",
        "ai"
    );

}

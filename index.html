<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #0b0b12;
    color: white;
}

.app {
    width: 100%;
    max-width: 900px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: #11111b;
}

/* Header */

.header {
    padding: 18px;
    background: #171724;
    border-bottom: 1px solid #29293a;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.status {
    font-size: 13px;
    color: #5cff9d;
}

/* Chat */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    margin-bottom: 15px;
    display: flex;
}

.message.user {
    justify-content: flex-start;
}

.message.ai {
    justify-content: flex-end;
}

.bubble {
    max-width: 80%;
    padding: 13px 16px;
    border-radius: 17px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.user .bubble {
    background: #292943;
}

.ai .bubble {
    background: #191933;
    border: 1px solid #303052;
}

/* Image */

.chat-image {
    max-width: 100%;
    max-height: 300px;
    border-radius: 12px;
    margin-top: 8px;
}

/* Input */

.bottom {
    padding: 12px;
    background: #171724;
    border-top: 1px solid #29293a;
}

.input-row {
    display: flex;
    gap: 8px;
}

#messageInput {
    flex: 1;
    border: none;
    outline: none;
    border-radius: 14px;
    padding: 14px;
    background: #252536;
    color: white;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 13px;
    padding: 12px 16px;
    background: #635bff;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.85;
}

.tools {
    display: flex;
    gap: 8px;
    margin-top: 9px;
}

.tools button {
    font-size: 12px;
    background: #29293b;
}

#imageInput {
    display: none;
}

/* Welcome */

.welcome {
    text-align: center;
    margin-top: 20vh;
    opacity: 0.9;
}

.welcome h1 {
    font-size: 30px;
}

.welcome p {
    color: #aaaabd;
}

/* Mobile */

@media(max-width:600px) {

    .bubble {
        max-width: 90%;
    }

    .header {
        padding: 14px;
    }

    .chat {
        padding: 12px;
    }

    button {
        padding: 11px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🤖 My AI
        </div>

        <div class="status">
            ● آنلاین
        </div>

    </div>


    <!-- CHAT -->

    <div id="chat" class="chat">

        <div class="welcome" id="welcome">

            <h1>🤖 My AI</h1>

            <p>
                سلام! من هوش مصنوعی ساده تو هستم.
            </p>

            <p>
                می‌توانی به من یاد بدهی.
            </p>

        </div>

    </div>


    <!-- INPUT -->

    <div class="bottom">

        <div class="input-row">

            <input
                id="messageInput"
                type="text"
                placeholder="پیامت را بنویس..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                ارسال
            </button>

        </div>


        <div class="tools">

            <button onclick="document.getElementById('imageInput').click()">
                🖼️ عکس
            </button>

            <button onclick="showMemory()">
                🧠 حافظه
            </button>

            <button onclick="clearMemory()">
                🗑️ پاک کردن
            </button>

        </div>


        <input
            id="imageInput"
            type="file"
            accept="image/*"
            onchange="handleImage(event)"
        >

    </div>

</div>


<script>

/* =====================================================
   حافظه AI
===================================================== */

let memory = {

    "سلام": "سلام! 👋",
    "سلام خوبی": "سلام! من خوبم 😄 تو چطوری؟",
    "خوبی": "مرسی، خوبم ❤️",
    "اسمت چیه": "من My AI هستم 🤖",
    "تو چی هستی": "من یک هوش مصنوعی ساده و قابل یادگیری هستم.",
    "چه کار میکنی": "با تو صحبت می‌کنم و چیزهایی که یادم می‌دهی را ذخیره می‌کنم.",
    "ممنون": "خواهش می‌کنم ❤️",
    "خداحافظ": "خداحافظ 👋"
};


/* =====================================================
   بارگذاری حافظه
===================================================== */

function loadMemory() {

    try {

        let saved = localStorage.getItem("my_ai_memory");

        if (saved) {

            let data = JSON.parse(saved);

            memory = {
                ...memory,
                ...data
            };

        }

    } catch(error) {

        console.log(error);

    }
}


/* =====================================================
   ذخیره حافظه
===================================================== */

function saveMemory() {

    localStorage.setItem(
        "my_ai_memory",
        JSON.stringify(memory)
    );

}


/* =====================================================
   تمیز کردن متن
===================================================== */

function cleanText(text) {

    return text
        .trim()
        .toLowerCase()
        .replaceAll("ي", "ی")
        .replaceAll("ك", "ک")
        .replace(/[؟?!.,]/g, "");

}


/* =====================================================
   افزودن پیام
===================================================== */

function addMessage(text, type) {

    let welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    let message = document.createElement("div");

    message.className = "message " + type;


    let bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;


    message.appendChild(bubble);

    document.getElementById("chat").appendChild(message);


    let chat = document.getElementById("chat");

    chat.scrollTop = chat.scrollHeight;

}


/* =====================================================
   پاسخ هوش مصنوعی
===================================================== */

function getAnswer(message) {

    let text = cleanText(message);


    /* راهنما */

    if (text === "/help") {

        return `
🤖 دستورات:

یاد بگیر: سؤال | جواب

/حافظه
نمایش حافظه

/پاک
پاک کردن حافظه

مثال:
یاد بگیر: پایتون چیست | پایتون یک زبان برنامه نویسی است.
`;

    }


    /* حافظه */

    if (text === "/حافظه") {

        return "🧠 من " +
            Object.keys(memory).length +
            " مورد در حافظه دارم.";

    }


    /* پاک کردن */

    if (text === "/پاک") {

        memory = {};

        saveMemory();

        return "🗑️ حافظه پاک شد.";

    }


    /* آموزش */

    if (text.startsWith("یاد بگیر:")) {

        let data = message.substring(
            message.indexOf(":") + 1
        );

        let parts = data.split("|");


        if (parts.length < 2) {

            return "❌ فرمت درست:\nیاد بگیر: سؤال | جواب";

        }


        let question = cleanText(parts[0]);

        let answer = parts
            .slice(1)
            .join("|")
            .trim();


        if (!question || !answer) {

            return "❌ سؤال یا جواب خالی است.";

        }


        memory[question] = answer;

        saveMemory();


        return "✅ یاد گرفتم!\n\n" +
               "سؤال: " + parts[0].trim() +
               "\nجواب: " + answer;

    }


    /* پاسخ مستقیم */

    if (memory[text]) {

        return memory[text];

    }


    /* جستجوی مشابه */

    let keys = Object.keys(memory);

    let best = null;

    let bestScore = 0;


    for (let key of keys) {

        let score = similarity(text, key);

        if (score > bestScore) {

            bestScore = score;

            best = key;

        }

    }


    if (best && bestScore >= 0.55) {

        return memory[best];

    }


    /* محاسبه */

    if (text.startsWith("حساب کن")) {

        let expression = text
            .replace("حساب کن", "")
            .replace(":", "")
            .trim();

        try {

            if (/^[0-9+\-*/(). %]+$/.test(expression)) {

                let result = Function(
                    '"use strict"; return (' +
                    expression +
                    ')'
                )();

                return "🧮 جواب: " + result;

            }

        } catch(error) {}

    }


    /* پاسخ ناشناخته */

    return `
🤔 هنوز جواب این سؤال را نمی‌دانم.

اگر می‌خواهی یادم بدهی:

یاد بگیر: ${message} | جواب موردنظر
`;

}


/* =====================================================
   شباهت متن
===================================================== */

function similarity(a, b) {

    if (a === b) {
        return 1;
    }


    if (a.includes(b) || b.includes(a)) {
        return 0.8;
    }


    let longer = a.length > b.length ? a : b;

    let shorter = a.length > b.length ? b : a;


    if (longer.length === 0) {
        return 1;
    }


    let distance = levenshtein(
        longer,
        shorter
    );


    return (
        longer.length - distance
    ) / longer.length;

}


/* =====================================================
   فاصله متنی
===================================================== */

function levenshtein(a, b) {

    let matrix = [];


    for (let i = 0; i <= b.length; i++) {

        matrix[i] = [i];

    }


    for (let j = 0; j <= a.length; j++) {

        matrix[0][j] = j;

    }


    for (let i = 1; i <= b.length; i++) {

        for (let j = 1; j <= a.length; j++) {

            if (b.charAt(i - 1) ===
                a.charAt(j - 1)) {

                matrix[i][j] =
                    matrix[i - 1][j - 1];

            } else {

                matrix[i][j] =
                    Math.min(

                        matrix[i - 1][j - 1] + 1,

                        matrix[i][j - 1] + 1,

                        matrix[i - 1][j] + 1

                    );

            }

        }

    }


    return matrix[b.length][a.length];

}


/* =====================================================
   ارسال پیام
===================================================== */

function sendMessage() {

    let input =
        document.getElementById("messageInput");

    let text = input.value.trim();


    if (!text) {
        return;
    }


    addMessage(text, "user");


    input.value = "";


    setTimeout(function() {

        let answer = getAnswer(text);

        addMessage(answer, "ai");

    }, 300);

}


/* =====================================================
   ارسال با Enter
===================================================== */

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    });


/* =====================================================
   عکس
===================================================== */

function handleImage(event) {

    let file = event.target.files[0];


    if (!file) {
        return;
    }


    let reader = new FileReader();


    reader.onload = function(e) {

        let welcome =
            document.getElementById("welcome");

        if (welcome) {
            welcome.remove();
        }


        let message =
            document.createElement("div");

        message.className =
            "message user";


        let bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        let image =
            document.createElement("img");

        image.src = e.target.result;

        image.className = "chat-image";


        bubble.appendChild(
            document.createTextNode(
                "🖼️ عکس من:"
            )
        );


        bubble.appendChild(
            document.createElement("br")
        );


        bubble.appendChild(image);


        message.appendChild(bubble);


        document
            .getElementById("chat")
            .appendChild(message);


        setTimeout(function() {

            addMessage(
                "عکس دریافت شد ✅\n" +
                "نام: " + file.name +
                "\nاندازه: " +
                Math.round(file.size / 1024) +
                " KB",
                "ai"
            );

        }, 500);

    };


    reader.readAsDataURL(file);

}


/* =====================================================
   نمایش حافظه
===================================================== */

function showMemory() {

    let keys = Object.keys(memory);


    if (keys.length === 0) {

        addMessage(
            "🧠 حافظه خالی است.",
            "ai"
        );

        return;

    }


    let text =
        "🧠 حافظه AI:\n\n";


    keys.forEach(function(key, index) {

        text +=
            (index + 1) +
            ". " +
            key +
            "\n";

    });


    addMessage(text, "ai");

}


/* =====================================================
   پاک کردن حافظه
===================================================== */

function clearMemory() {

    let ok = confirm(
        "آیا مطمئنی می‌خواهی حافظه پاک شود؟"
    );


    if (!ok) {
        return;
    }


    memory = {};

    saveMemory();


    addMessage(
        "🗑️ حافظه با موفقیت پاک شد.",
        "ai"
    );

}


/* =====================================================
   شروع
===================================================== */

loadMemory();

</script>

</body>
</html>

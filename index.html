<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#08080c;
 color:#fff;
 font-family:Arial,sans-serif
}

.app{
 max-width:850px;
 height:100vh;
 margin:auto;
 display:flex;
 flex-direction:column;
 background:#111118
}

header{
 padding:16px;
 background:#171720;
 border-bottom:1px solid #292936;
 display:flex;
 align-items:center;
 gap:12px
}

.logo{
 width:48px;
 height:48px;
 border-radius:50%;
 object-fit:cover;
 background:#222
}

h1{
 margin:0;
 font-size:21px
}

.status{
 color:#4ade80;
 font-size:12px;
 margin-top:4px
}

#chat{
 flex:1;
 overflow-y:auto;
 padding:15px
}

.msg{
 max-width:85%;
 padding:11px 14px;
 margin:8px 0;
 border-radius:15px;
 line-height:1.7;
 white-space:pre-wrap
}

.user{
 margin-right:auto;
 background:#27273a
}

.ai{
 margin-left:auto;
 background:#1b1b25;
 border:1px solid #30303d
}

.chat-img{
 max-width:280px;
 max-height:280px;
 border-radius:14px
}

.tools{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:8px;
 background:#171720
}

button{
 border:0;
 border-radius:11px;
 padding:11px 14px;
 color:white;
 background:#30303f;
 cursor:pointer;
 white-space:nowrap
}

button:hover{
 background:#424255
}

.send{
 background:#2563eb
}

.input{
 display:flex;
 gap:8px;
 padding:10px;
 background:#171720
}

#input{
 flex:1;
 min-width:0;
 padding:13px;
 border:0;
 outline:0;
 border-radius:12px;
 background:#262631;
 color:white;
 font-size:15px
}

#file{
 display:none
}
</style>
</head>

<body>

<div class="app">

<header>
<img id="logo" class="logo" src="images/ai.png"
     onerror="this.style.display='none'">

<div>
<h1>🤖 My AI</h1>
<div class="status">● آماده</div>
</div>
</header>

<div id="chat"></div>

<div class="tools">
<button onclick="pickImage()">🖼️ عکس</button>
<button onclick="showMemory()">🧠 حافظه</button>
<button onclick="showHelp()">❓ راهنما</button>
<button onclick="clearLearned()">🗑️ پاک کردن یادگیری</button>
</div>

<input id="file" type="file" accept="image/*">

<div class="input">
<input id="input"
       placeholder="پیامت را بنویس..."
       autocomplete="off">

<button class="send" onclick="send()">ارسال</button>
</div>

</div>

<script>

/* =====================================
   🧠 تنظیمات
===================================== */

const DATA_URL = "data.json";

let brain = {};
let learned = {};


/* =====================================
   🧹 تمیز کردن متن
===================================== */

function clean(text){

    return String(text)
        .trim()
        .toLowerCase()
        .replace(/[؟?!،,.؛:]/g,"")
        .replace(/\s+/g," ");

}


/* =====================================
   💾 حافظه یادگیری کاربر
===================================== */

function loadLearned(){

    try{

        learned =
            JSON.parse(
                localStorage.getItem("MY_AI_LEARNED") || "{}"
            );

    }catch{

        learned = {};

    }

}


function saveLearned(){

    localStorage.setItem(
        "MY_AI_LEARNED",
        JSON.stringify(learned)
    );

}


/* =====================================
   📚 بارگذاری data.json
===================================== */

async function loadBrain(){

    try{

        const response =
            await fetch(DATA_URL);

        if(!response.ok)
            throw new Error("data.json not found");

        const data =
            await response.json();

        brain = data;

        addAI(
            "🧠 مغز اطلاعاتی من آماده شد!\n" +
            Object.keys(brain).length.toLocaleString() +
            " ورودی در data.json پیدا شد."
        );

    }catch(error){

        brain = {};

        addAI(
            "⚠️ فایل data.json پیدا نشد.\n" +
            "اگر آن را در کنار index.html گذاشتی، صفحه را Refresh کن."
        );

    }

}


/* =====================================
   💬 پیام
===================================== */

function addUser(text){

    const div =
        document.createElement("div");

    div.className = "msg user";
    div.textContent = text;

    document
        .getElementById("chat")
        .appendChild(div);

    scrollChat();

}


function addAI(text){

    const div =
        document.createElement("div");

    div.className = "msg ai";
    div.textContent = text;

    document
        .getElementById("chat")
        .appendChild(div);

    scrollChat();

}


function scrollChat(){

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================
   🧠 یادگیری
===================================== */

function teach(text){

    const data =
        text.substring(9).trim();

    const parts =
        data.split("|");

    if(parts.length < 2){

        return "فرمت درست:\nیاد بگیر: سؤال | جواب";

    }

    const question =
        clean(parts[0]);

    const answer =
        parts.slice(1).join("|").trim();

    if(!question || !answer)
        return "❌ سؤال یا جواب خالی است.";

    learned[question] =
        answer;

    saveLearned();

    return "✅ یاد گرفتم!\n\n" +
           "سؤال: " + question +
           "\nجواب: " + answer;

}


/* =====================================
   🔎 پیدا کردن پاسخ
===================================== */

function findAnswer(text){

    const q =
        clean(text);


    /* یادگیری شخصی */

    if(learned[q])
        return learned[q];


    /* data.json */

    if(brain[q])
        return brain[q];


    /* جستجوی ساده داخل کلیدها */

    const keys =
        Object.keys(learned);

    for(const key of keys){

        if(
            q.includes(key) ||
            key.includes(q)
        ){

            return learned[key];

        }

    }


    const brainKeys =
        Object.keys(brain);

    for(const key of brainKeys){

        if(
            q.includes(key) ||
            key.includes(q)
        ){

            return brain[key];

        }

    }


    return null;

}


/* =====================================
   🧮 ماشین حساب
===================================== */

function calculator(text){

    let x =
        text
        .replace("حساب کن","")
        .replace("محاسبه کن","")
        .trim();

    if(
        !/^[0-9+\-*/().%\s]+$/.test(x)
    )
        return null;

    try{

        const result =
            Function(
                '"use strict";return (' +
                x +
                ')'
            )();

        if(Number.isFinite(result))
            return "🧮 جواب: " + result;

    }catch{}

    return null;

}


/* =====================================
   🤖 پاسخ AI
===================================== */

function answer(text){

    const q =
        clean(text);


    /* راهنما */

    if(q === "/help")
        return `
🤖 My AI

یاد دادن:
یاد بگیر: سؤال | جواب

مثال:
یاد بگیر: پایتون چیست؟ | پایتون یک زبان برنامه‌نویسی است.

دستورات:

/memory
تعداد اطلاعات

/clear
پاک کردن یادگیری شخصی

/help
راهنما
`;


    /* حافظه */

    if(q === "/memory"){

        return (
            "🧠 اطلاعات data.json: " +
            Object.keys(brain).length.toLocaleString() +
            "\n\n" +
            "📚 چیزهایی که خودت یاد دادی: " +
            Object.keys(learned).length.toLocaleString()
        );

    }


    /* پاک کردن */

    if(q === "/clear"){

        clearLearned(false);

        return "🗑️ یادگیری‌های شخصی پاک شدند.";

    }


    /* آموزش */

    if(
        text.trim().startsWith("یاد بگیر:")
    ){

        return teach(text);

    }


    /* ماشین حساب */

    const math =
        calculator(text);

    if(math)
        return math;


    /* پاسخ */

    const result =
        findAnswer(text);

    if(result)
        return result;


    return (
        "🤔 جواب این سؤال را در اطلاعاتم پیدا نکردم.\n\n" +
        "می‌توانی به من یاد بدهی:\n" +
        "یاد بگیر: " +
        text +
        " | جواب"
    );

}


/* =====================================
   📤 ارسال
===================================== */

function send(){

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();

    if(!text)
        return;

    addUser(text);

    input.value = "";

    setTimeout(()=>{

        addAI(
            answer(text)
        );

    },150);

}


/* =====================================
   ⌨️ Enter
===================================== */

document
.getElementById("input")
.addEventListener(
    "keydown",
    e=>{

        if(e.key === "Enter")
            send();

    }
);


/* =====================================
   🧠 حافظه
===================================== */

function showMemory(){

    addAI(
        "🧠 اطلاعات اصلی: " +
        Object.keys(brain).length.toLocaleString() +
        "\n📚 یادگیری شخصی: " +
        Object.keys(learned).length.toLocaleString()
    );

}


/* =====================================
   ❓ راهنما
===================================== */

function showHelp(){

    addAI(answer("/help"));

}


/* =====================================
   🗑️ پاک کردن یادگیری
===================================== */

function clearLearned(confirmBox=true){

    if(
        confirmBox &&
        !confirm("یادگیری‌های شخصی پاک شوند؟")
    )
        return;

    learned = {};

    saveLearned();

    addAI(
        "🗑️ یادگیری‌های شخصی پاک شدند."
    );

}


/* =====================================
   🖼️ عکس
===================================== */

function pickImage(){

    document
        .getElementById("file")
        .click();

}


document
.getElementById("file")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                const div =
                    document.createElement("div");

                div.className =
                    "msg user";

                const img =
                    document.createElement("img");

                img.src =
                    e.target.result;

                img.className =
                    "chat-img";

                div.appendChild(img);

                document
                    .getElementById("chat")
                    .appendChild(div);

                scrollChat();

                addAI(
                    "🖼️ عکس دریافت شد!"
                );

            };

        reader.readAsDataURL(file);

    }
);


/* =====================================
   🚀 شروع
===================================== */

loadLearned();

addAI(
    "سلام 👋\nمن My AI هستم.\nدارم اطلاعاتم را بارگذاری می‌کنم..."
);

loadBrain();

</script>

</body>
</html>

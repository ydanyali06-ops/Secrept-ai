<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
}

.app {
    max-width: 800px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: #111118;
}

header {
    padding: 18px;
    background: #171720;
    border-bottom: 1px solid #292936;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.status {
    margin-top: 5px;
    color: #4ade80;
    font-size: 13px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    margin: 8px 0;
    border-radius: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.user {
    margin-right: auto;
    background: #25253a;
    border-bottom-right-radius: 4px;
}

.ai {
    margin-left: auto;
    background: #191922;
    border: 1px solid #2c2c38;
    border-bottom-left-radius: 4px;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #171720;
    border-top: 1px solid #292936;
}

#input {
    flex: 1;
    border: none;
    outline: none;
    border-radius: 12px;
    padding: 13px;
    background: #242430;
    color: white;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 11px 14px;
    background: #303044;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #404057;
}

.send {
    background: #2563eb;
}

.send:hover {
    background: #1d4ed8;
}

.buttons {
    display: flex;
    gap: 7px;
    padding: 8px 10px;
    overflow-x: auto;
    background: #171720;
}

.buttons button {
    white-space: nowrap;
}

#imageInput {
    display: none;
}

.chat-image {
    max-width: 250px;
    max-height: 250px;
    border-radius: 12px;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1>🤖 My AI</h1>
    <div class="status">● آماده</div>
</header>

<div id="chat"></div>

<div class="buttons">
    <button onclick="document.getElementById('imageInput').click()">🖼️ عکس</button>
    <button onclick="showMemory()">🧠 حافظه</button>
    <button onclick="showHelp()">❓ راهنما</button>
    <button onclick="clearMemory()">🗑️ پاک کردن</button>
</div>

<input
    type="file"
    id="imageInput"
    accept="image/*"
    onchange="sendImage(event)"
>

<div class="input-area">
    <input
        id="input"
        type="text"
        placeholder="پیامت را بنویس..."
        autocomplete="off"
    >

    <button class="send" onclick="sendMessage()">ارسال</button>
</div>

</div>

<script>

/* ==========================================
   🧠 حافظه اصلی AI
========================================== */

const MAX_MEMORY = 10000;

const defaultMemory = {

    "سلام": "سلام 👋 خوش اومدی! من My AI هستم.",
    "خوبی": "مرسی 😄 من آماده‌ام.",
    "اسمت چیه": "اسم من My AI هست 🤖",
    "تو چی هستی": "من یک هوش مصنوعی ساده هستم که با JavaScript ساخته شده‌ام.",
    "چه کار میکنی": "می‌توانم با تو چت کنم، چیزهایی یاد بگیرم و محاسبات ساده انجام بدهم.",
    "ممنون": "خواهش می‌کنم ❤️",
    "خداحافظ": "خداحافظ 👋",
    "صبح بخیر": "صبح بخیر ☀️",
    "شب بخیر": "شب بخیر 🌙",
    "کمک": "برای راهنما دکمه ❓ را بزن یا /help بنویس."
};


/* ==========================================
   💾 بارگذاری حافظه
========================================== */

let memory = {};

try {

    const saved =
        localStorage.getItem("MY_AI_MEMORY");

    if (saved) {
        memory = JSON.parse(saved);
    }

} catch (error) {

    memory = {};

}


/* اضافه کردن حافظه پیش‌فرض */

Object.keys(defaultMemory).forEach(key => {

    if (!memory[key]) {
        memory[key] = defaultMemory[key];
    }

});


/* ==========================================
   🧹 تمیز کردن متن
========================================== */

function cleanText(text) {

    return text
        .toString()
        .trim()
        .toLowerCase()
        .replace(/[؟?!،,.]/g, "")
        .replace(/\s+/g, " ");

}


/* ==========================================
   💾 ذخیره حافظه
========================================== */

function saveMemory() {

    const keys = Object.keys(memory);

    if (keys.length > MAX_MEMORY) {

        const newMemory = {};

        keys
            .slice(-MAX_MEMORY)
            .forEach(key => {
                newMemory[key] = memory[key];
            });

        memory = newMemory;
    }

    localStorage.setItem(
        "MY_AI_MEMORY",
        JSON.stringify(memory)
    );

}


/* ==========================================
   💬 نمایش پیام
========================================== */

function addMessage(text, type) {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

}


/* ==========================================
   🧠 یادگیری AI
========================================== */

function teach(text) {

    const content =
        text.substring("یاد بگیر:".length).trim();

    const parts = content.split("|");

    if (parts.length < 2) {

        return "فرمت درست:\nیاد بگیر: سؤال | جواب";

    }

    const question =
        cleanText(parts[0]);

    const answer =
        parts.slice(1).join("|").trim();

    if (!question || !answer) {

        return "سؤال و جواب نمی‌توانند خالی باشند.";

    }

    memory[question] = answer;

    saveMemory();

    return "✅ یاد گرفتم!\n\n" +
           "سؤال: " + parts[0].trim() +
           "\nجواب: " + answer;

}


/* ==========================================
   🔎 فاصله / شباهت ساده
========================================== */

function similarity(a, b) {

    a = cleanText(a);
    b = cleanText(b);

    if (a === b) {
        return 1;
    }

    if (a.includes(b) || b.includes(a)) {
        return 0.8;
    }

    const wordsA = a.split(" ");
    const wordsB = b.split(" ");

    let same = 0;

    wordsA.forEach(word => {

        if (wordsB.includes(word)) {
            same++;
        }

    });

    return same /
        Math.max(wordsA.length, wordsB.length);

}


/* ==========================================
   🧮 ماشین حساب
========================================== */

function calculate(text) {

    const expression =
        text
        .replace(/حساب کن/g, "")
        .replace(/محاسبه کن/g, "")
        .replace(/=/g, "")
        .trim();

    if (!/^[0-9+\-*/().%\s]+$/.test(expression)) {

        return null;

    }

    try {

        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();

        if (Number.isFinite(result)) {

            return "🧮 جواب: " + result;

        }

    } catch (error) {}

    return null;

}


/* ==========================================
   🤖 پاسخ AI
========================================== */

function getAnswer(text) {

    const original = text.trim();

    const question =
        cleanText(original);


    /* یادگیری */

    if (
        original.startsWith("یاد بگیر:")
    ) {

        return teach(original);

    }


    /* حافظه */

    if (question === "/memory") {

        return "🧠 تعداد حافظه‌های من: " +
               Object.keys(memory).length;

    }


    /* پاک کردن */

    if (question === "/clear") {

        memory = {
            ...defaultMemory
        };

        saveMemory();

        return "🗑️ حافظه پاک شد و حافظه اصلی دوباره فعال شد.";

    }


    /* راهنما */

    if (question === "/help") {

        return `
🤖 راهنمای My AI

برای یاد دادن:
یاد بگیر: سؤال | جواب

مثال:
یاد بگیر: پایتون چیه؟ | پایتون یک زبان برنامه نویسی است.

دستورات:

/memory
نمایش تعداد حافظه

/clear
پاک کردن حافظه

/help
نمایش راهنما

همچنین می‌توانی محاسبه کنی:

2 + 2

یا:

حساب کن 50 * 3
`;

    }


    /* ماشین حساب */

    const mathResult =
        calculate(original);

    if (mathResult) {

        return mathResult;

    }


    /* پاسخ دقیق */

    if (memory[question]) {

        return memory[question];

    }


    /* پیدا کردن سؤال مشابه */

    let bestKey = null;
    let bestScore = 0;

    Object.keys(memory).forEach(key => {

        const score =
            similarity(question, key);

        if (score > bestScore) {

            bestScore = score;
            bestKey = key;

        }

    });


    if (
        bestKey &&
        bestScore >= 0.65
    ) {

        return memory[bestKey];

    }


    /* پاسخ وقتی نمی‌داند */

    return `
🤔 جواب این سؤال را هنوز نمی‌دانم.

اگر می‌خواهی یادم بدهی، بنویس:

یاد بگیر: ${original} | جواب سؤال
`;

}


/* ==========================================
   📤 ارسال پیام
========================================== */

function sendMessage() {

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    setTimeout(() => {

        const answer =
            getAnswer(text);

        addMessage(answer, "ai");

    }, 200);

}


/* ==========================================
   ⌨️ دکمه Enter
========================================== */

document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


/* ==========================================
   🖼️ ارسال عکس
========================================== */

function sendImage(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e) {

        const chat =
            document.getElementById("chat");

        const message =
            document.createElement("div");

        message.className =
            "message user";

        const img =
            document.createElement("img");

        img.src =
            e.target.result;

        img.className =
            "chat-image";

        message.appendChild(img);

        chat.appendChild(message);

        chat.scrollTop =
            chat.scrollHeight;

        addMessage(
            "🖼️ عکس دریافت شد!",
            "ai"
        );

    };

    reader.readAsDataURL(file);

}


/*
